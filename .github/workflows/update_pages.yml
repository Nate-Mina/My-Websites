name: Update Pages Aggregator
on:
  schedule:
    # daily at midnight UTC (change as needed)
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # use GITHUB_TOKEN to push back to this repo
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '18'

      - name: Run generator
        env:
          # username to scan (change if you want)
          GITHUB_USER: Nate-Mina
          # optional PAT for private repos / higher rate limits
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          node scripts/generate_pages.js

      - name: Commit & push changes (if any)
        uses: EndBug/add-and-commit@v9
        with:
          author_name: 'github-actions'
          author_email: 'github-actions@github.com'
          message: 'Update pages aggregator'
          add: 'docs/index.html'
          push: true
        env:
          # Use the built-in token to push to this repo
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}